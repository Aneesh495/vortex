[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-streaming"
version = "0.1.0"
description = "Official Python client SDK for the Vortex distributed streaming platform."
readme = "README.md"
authors = [{ name = "Aneesh Krishna" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
